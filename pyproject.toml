[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest"
version = "0.1.0"
description = "Automação E2E do Formula Certa"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["autotest"]
packages = ["fc", "core", "data", "database", "tools", "webapp"]
