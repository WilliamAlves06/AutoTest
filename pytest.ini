[pytest]
# Coleta padrão = suíte unitária (rápida, sem app/banco). Os fluxos E2E em flows/
# são rodados explicitamente por caminho (precisam do Formula Certa + Firebird).
testpaths = tests
# test_*.py = suíte unitária; os demais padrões coletam os fluxos E2E atuais
# (serão renomeados para test_*.py na Fase 2).
python_files = test_*.py *_flow.py CT-*.py consulta_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers
norecursedirs = .venv .git output logs mappings .pytest_cache flows/Gravados

markers =
    unit: testes puros, sem app/banco (rodam em qualquer runner, inclusive CI nuvem)
    e2e: ponta-a-ponta — exige Formula Certa + Firebird (runner Windows self-hosted)
    filiais: fluxo de Filiais
    notas: fluxo de Notas
    receitas: fluxo de Receitas
    produtos: fluxo de Produtos
