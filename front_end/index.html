<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Automação</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header class="header">
      <div>
        <h1>Central de Automação</h1>
        <p>Painel de execução dos fluxos automatizados</p>
      </div>
    </header>

    <section class="cards">

      <div class="card">
        <span>Última Execução</span>
        <h2 id="lastExecution">-</h2>
      </div>

      <div class="card success">
        <span>✅ Passou</span>
        <h2 id="passed">0</h2>
      </div>

      <div class="card error">
        <span>❌ Falhou</span>
        <h2 id="failed">0</h2>
      </div>

      <div class="card warning">
        <span>⚠️ Em Execução</span>
        <h2 id="executing">0</h2>
      </div>

    </section>

    <section class="content-grid">

      <div class="panel left-panel">

        <h2>Executar Fluxo</h2>

        <select id="flowSelect">
          <option>Login Flow</option>
          <option>Cadastro Produto</option>
          <option>Fluxo Fiscal</option>
        </select>

        <button id="runBtn">▶ Executar</button>

      </div>

      <div class="panel logs-panel">

        <div class="panel-header">
          <h2>Logs em Tempo Real</h2>
          <div class="live-dot"></div>
        </div>

        <div class="terminal" id="terminal">
          <p>[INFO] Sistema iniciado...</p>
        </div>

      </div>

    </section>

    <section class="panel history-panel">

      <div class="panel-header">
        <h2>Histórico</h2>
      </div>

      <table>

        <thead>
          <tr>
            <th>Fluxo</th>
            <th>Data</th>
            <th>Tempo</th>
            <th>Resultado</th>
          </tr>
        </thead>

        <tbody id="historyTable">
          <tr>
            <td>Cadastro Produto</td>
            <td>14/05/2026 15:00</td>
            <td>00:42</td>
            <td>
              <span class="badge pass">PASSOU</span>
            </td>
          </tr>
        </tbody>

      </table>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
